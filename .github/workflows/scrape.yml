# Scheduled/manual scraping of medofast.ir in time-boxed batches.
#
# Nothing runs until you dispatch it manually (schedule is commented out on
# purpose). Before the first run you must create the repo secret:
#   1. Run `medo login` locally, then base64-encode the session file:
#        base64 -w0 data/storage_state.json   (Linux/macOS)
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret: name MEDO_STORAGE_STATE, paste the base64.
# The workflow refuses to run without it (no session = 403 = wasted run).

name: Scrape medofast (time-boxed batch)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id to scrape (empty = every pending topic, in order)"
        required: false
        default: ""
      max_minutes:
        description: "Time box for this batch (GitHub job limit is ~350 min)"
        required: false
        default: "330"
  # Enable only after several clean manual runs from your own machine:
  # schedule:
  #   - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: scrape-medofast
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Restore session (repo secret, never logged)
        env:
          MEDO_STORAGE_STATE_B64: ${{ secrets.MEDO_STORAGE_STATE }}
        run: |
          if [ -z "$MEDO_STORAGE_STATE_B64" ]; then
            echo "::error::MEDO_STORAGE_STATE secret is not set. Run 'medo login' locally, base64-encode data/storage_state.json and add it as a repo secret. Refusing to scrape without a session."
            exit 1
          fi
          mkdir -p data
          printf '%s' "$MEDO_STORAGE_STATE_B64" | base64 -d > data/storage_state.json
          echo "Session restored (contents never printed)."

      - name: Restore database & assets from previous run
        uses: actions/cache/restore@v4
        with:
          path: |
            data/medo.db
            data/medo.db-wal
            data/medo.db-shm
            data/assets
          key: medo-data-${{ github.run_id }}
          restore-keys: medo-data-

      - name: Scrape (polite, time-boxed)
        run: |
          set -o pipefail
          if [ -n "${{ inputs.topic }}" ]; then
            TARGET="--topic ${{ inputs.topic }}"
          else
            TARGET="--all"
          fi
          medo discover
          medo scrape $TARGET --max-minutes "${{ inputs.max_minutes }}" 2>&1 | tee scrape.log

      - name: Persist data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/medo.db
            data/medo.db-wal
            data/medo.db-shm
            data/assets
          key: medo-data-${{ github.run_id }}

      - name: Upload data artifact (inspect progress in the UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medo-data-${{ github.run_id }}
          path: |
            data/
            !data/storage_state.json
          retention-days: 14
          if-no-files-found: ignore

      - name: IP-block / captcha guard
        if: always()
        run: |
          if [ -f scrape.log ] && grep -qiE "captcha|access denied|blocked|cloudflare|403 forbidden" scrape.log; then
            echo "::error::The site appears to have blocked this runner IP (captcha/403 detected). GitHub datacenter IPs are commonly refused. Stop scheduled runs and scrape from your own machine instead: medo login && medo scrape --topic <N>."
            exit 1
          fi
          echo "No block signals found in the log."
