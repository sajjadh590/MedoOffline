[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medooffline"
version = "0.1.0"
description = "Offline mirror of medofast.ir qbank"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "typer[all]>=0.12",
    "jinja2>=3.1",
    "pillow>=10.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
# `pip install -e .[dev]` — what the test suite needs beyond the app itself.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
medo = "medo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["medo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
